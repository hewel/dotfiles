# Fcitx5 on Wayland (https://fcitx-im.org/wiki/Using_Fcitx_5_on_Wayland)
# XMODIFIERS: always required for X11/XWayland
XMODIFIERS=@im=fcitx
# QT: niri is not KWin — need fcitx module (no text-input-v2)
QT_IM_MODULE=fcitx
# Qt 6.7+ fallback chain (harmless if unused)
QT_IM_MODULES=wayland;fcitx;ibus
# SDL games on X11 path
SDL_IM_MODULE=fcitx
# Do NOT set GTK_IM_MODULE globally:
# - Wayland GTK3/4 should use text-input-v3
# - X11/XWayland GTK uses gtk-im-module from settings.ini below
# Steam: use steam-fcitx (forces XIM inside pressure-vessel)
