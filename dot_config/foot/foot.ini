# Migrated from ~/.config/alacritty/alacritty.toml
# Reference: https://codeberg.org/dnkl/foot/src/branch/master/foot.ini
#            foot.ini(5)

# Official Catppuccin Frappé (shipped with foot)
include=/usr/share/foot/themes/catppuccin-frappe

# alacritty: font size = 12, family = Lilex (+ Bold / Italic / Bold Italic)
font=Lilex:size=12
font-bold=Lilex:style=Bold:size=12
font-italic=Lilex:style=Italic:size=12
font-bold-italic=Lilex:style=Bold Italic:size=12

# alacritty: window.padding = { x = 12, y = 12 }
pad=12x12

# alacritty: selection.save_to_clipboard = true
# (Alacritty also always writes the primary selection; `both` matches that.)
selection-target=both


[tweak]
sixel=yes
# alacritty: working_directory = "~"
# Foot has no config equivalent. Launch with `foot -D ~`, or rely on OSC-7
# (spawn-terminal then opens in the current shell directory).

[cursor]
# alacritty: style = { shape = "Block", blinking = "On" }
style=block
blink=yes

[mouse]
# alacritty: hide_when_typing = true
hide-when-typing=yes

[csd]
# alacritty: window.decorations = "None"
preferred=none
# Hide the titlebar if the compositor still forces client decorations.
size=0

[key-bindings]
# alacritty: Control+Shift+n = CreateNewWindow (also foot's default)
# alacritty: Control+"+"/Control+"-"/Control+0 font-size (also foot's default)
spawn-terminal=Control+Shift+n

[text-bindings]
# alacritty: Shift+Return emits a literal newline
\x0a=Shift+Return

# Official theme has no opacity/blur; keep the previous Alacritty values.
[colors-dark]
alpha=0.875
blur=yes
