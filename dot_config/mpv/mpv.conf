# ==============================================================================
# Video Output & GPU API
# ==============================================================================
# Use the high-quality profile as a baseline
profile=gpu-hq

# Use the modern rendering backend (essential for proper HDR and advanced scaling)
vo=gpu-next

# Vulkan is the most stable and performant API for AMD GPUs on Linux
gpu-api=vulkan

# Native Wayland Vulkan context
gpu-context=waylandvk

# ==============================================================================
# Hardware Decoding
# ==============================================================================
# Use VAAPI for AMD GPUs on Linux for efficient hardware decoding
hwdec=vaapi
# Fallback: if vaapi fails, auto-safe will try other available methods
# hwdec=auto-safe

# ==============================================================================
# HDR & Color Management
# ==============================================================================
# CRITICAL FOR HDR: Tells the Wayland compositor the video's color space.
# This allows the compositor (like niri) to switch the display to HDR mode.
target-colorspace-hint=yes

# High-quality tone-mapping algorithm for displaying HDR content on SDR screens
# (if your display is not currently in HDR mode)
tone-mapping=bt.2446a

# ==============================================================================
# Scaling & Image Quality (Optimized for RX 7900 XTX)
# ==============================================================================
# Your 7900 XTX can easily handle heavy shaders. EWA Lanczos provides excellent
# sharpness with minimal artifacts for upscaling.
scale=ewa_lanczossharp
cscale=ewa_lanczossharp

# Downscaling algorithm
dscale=mitchell

# Reduce ringing artifacts caused by scaling
scale-antiring=0.7
cscale-antiring=0.7

# Automatic dither depth to match your display output
dither-depth=auto

# ==============================================================================
# Wayland Specific
# ==============================================================================
# Let the Wayland compositor handle vsync to prevent tearing and stuttering
wayland-disable-vsync=yes

# ==============================================================================
# Audio
# ==============================================================================
# Use PipeWire natively, which is standard on modern Arch/CachyOS setups
# ao=pipewire

# ==============================================================================
# General & UX
# ==============================================================================
# Keep the player open after the video finishes
keep-open=yes

# Save video position on quit
save-position-on-quit=yes

# Sutitles
sub-ass-force-margins=yes
sub-use-margins=yes
