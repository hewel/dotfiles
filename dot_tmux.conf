##### Modern tmux config for development
##### Save as: ~/.tmux.conf

##### Terminal / colors / compatibility

# Use modern tmux terminfo inside tmux.
# If a remote machine lacks tmux-256color, install ncurses-term there,
# or temporarily change this to screen-256color.
set -g default-terminal "tmux-256color"

# True color support for modern terminals.
# Add/remove patterns depending on your terminal's $TERM outside tmux.
set -as terminal-features ",xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB"
set -as terminal-features ",alacritty:RGB,kitty:RGB,wezterm:RGB,foot*:RGB,ghostty*:RGB"

# Better editor integration.
set -s focus-events on
set -s set-clipboard on

# Make Escape feel responsive in Vim/Neovim.
# Increase this to 30-50 if you often use tmux over slow SSH links.
set -s escape-time 10

# Large scrollback for logs, tests, build output.
set -g history-limit 100000

# Start windows and panes from 1, not 0.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Resize windows aggressively when clients have different sizes.
setw -g aggressive-resize on

# Keep tmux alive when a session/window is destroyed.
set -g detach-on-destroy off

# Mouse support: select panes, resize panes, scroll copy-mode history.
set -g mouse on


##### Prefix

# Use Ctrl-a as prefix. Easier to hit than Ctrl-b.
unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix


##### Reload / edit config

bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Open this config in a popup. Requires tmux with display-popup support.
bind-key e display-popup -E -w 90% -h 85% "${EDITOR} ~/.tmux.conf"

# Open a shell popup.
bind-key P display-popup -E -w 90% -h 85%


##### Windows / panes

# Split panes in the current working directory.
unbind-key %
unbind-key '"'
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# New window in the current working directory.
bind-key c new-window -c "#{pane_current_path}"

# Vim-style pane navigation after prefix.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vim-style pane navigation without prefix: Alt-h/j/k/l.
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Resize panes quickly after prefix.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Switch windows with Alt-left/right.
bind-key -n M-Left previous-window
bind-key -n M-Right next-window

# Safer killing.
bind-key x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind-key X confirm-before -p "kill window #W? (y/n)" kill-window

# Toggle synchronized input for all panes in the current window.
bind-key S setw synchronize-panes \; display-message "synchronize-panes: #{?synchronize-panes,on,off}"

# Toggle mouse quickly.
bind-key m set -g mouse \; display-message "mouse: #{?mouse,on,off}"

# Search windows.
bind-key f command-prompt -p "find window:" "find-window '%%'"

# Choose session/window/pane tree.
bind-key Space choose-tree -Zw


##### Copy mode - Helix-friendly version

setw -g mode-keys vi
set -g status-keys vi

# Enter copy mode
bind-key v copy-mode

# Helix-like: Space starts selection, Enter copies
bind-key -T copy-mode-vi Space send-keys -X begin-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Also allow y to copy, because Helix uses y for yank
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Escape behavior
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Rectangle/block selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Search
bind-key -T copy-mode-vi / command-prompt -i -p "search down:" "send-keys -X search-forward-incremental '%%'"
bind-key -T copy-mode-vi ? command-prompt -i -p "search up:" "send-keys -X search-backward-incremental '%%'"
bind-key -T copy-mode-vi n send-keys -X search-again
bind-key -T copy-mode-vi N send-keys -X search-reverse

# Mouse selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear


##### Activity / bells

setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action any


##### Status bar - fancy modern theme

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 2
set -g status-left-length 100
set -g status-right-length 200

# Base colors
set -g status-style "fg=#cdd6f4,bg=#11111b"
set -g message-style "fg=#cdd6f4,bg=#313244,bold"
set -g message-command-style "fg=#cdd6f4,bg=#313244,bold"
set -g mode-style "fg=#11111b,bg=#89b4fa,bold"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Window separator
setw -g window-status-separator ""

# Left: session name
set -g status-left "#[fg=#11111b,bg=#89b4fa,bold] 󰒋 #S #[fg=#89b4fa,bg=#11111b]"

##### Optional: terminal-specific passthrough
##### Enable only if your tools need terminal graphics/protocol passthrough.
##### For example: some image preview workflows in Kitty/WezTerm/iTerm2.
# set -g allow-passthrough on

