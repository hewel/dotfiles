[notification]
background_opacity = 0.84999998100101948
layer = "overlay"
monitors = [ "DP-1" ]

[osd]
background_opacity = 0.84999998100101948
border = false
monitors = [ "DP-1" ]
orientation = "vertical"
position = "top_left"
position_vertical = "top_left"

    [osd.kinds]
    keyboard_layout = false
    media = false

[plugins]
enabled = [
    "felipeartur/ai-usagebar",
    "hewel/overview",
    "hewel/nosleep",
    "noctalia/notes",
    "hewel/secondary",
    "oldirtty/color_picker"
]

[shell]
card_borders = false
font_family = "更纱黑体 SC"
popup_borders = false
screen_time_enabled = true

    [shell.mpris]
    blacklist = [ "Mozilla zen" ]

    [shell.panel]
    borders = false
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 24

    [shell.shadow]
    alpha = 0.39999999105930328
    direction = "center"

[theme]
builtin = "Noctalia"
community_palette = "ADW"
custom_palette = "Colloid"
mode = "light"
source = "custom"

[wallpaper]
directory = "/home/hewel/Pictures/Wallpaper"
fill_mode = "span"

    [wallpaper.default]
    path = "/home/hewel/Pictures/Wallpaper/wallhaven-kxd1md.jpg"

    [wallpaper.last]
    path = "/home/hewel/Pictures/Wallpaper/wallhaven-kxd1md.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/hewel/Pictures/Wallpaper/wallhaven-kxd1md.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/hewel/Pictures/Wallpaper/wallhaven-kxd1md.jpg"

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.launcher]
enabled = false

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.tray]
drawer = true

[widget.widget]
type = "oldirtty/color_picker:widget"

[widget.workspaces]
active_pill_size = 2.3999999999999999
change_color_on_hover = false
empty_color = "outline"
inactive_pill_size = 1.6000000000000001
occupied_color = "outline"
show_labels = false

    [widget.workspaces.actions]
    right = "exec noctalia msg panel-toggle hewel/overview:panel"