config_version = 14

[backdrop]
blur_intensity = 0.99999997764825821
enabled = true
tint_intensity = 0.19999999552965164

[bar.default]
background_opacity = 0.84999998100101948
center = [ "media", "center-gap-1", "clock", "center-gap-2", "nosleep", "notes" ]
end = [ "tray", "clipboard", "network", "bluetooth", "volume", "notifications", "battery", "control-center", "session" ]
margin_ends = 0
radius = 16
radius_bottom_left = 0
radius_bottom_right = 16
radius_top_left = 0
radius_top_right = 16
start = [ "launcher", "workspaces", "active_window", "widget" ]

[calendar]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 336.0
    box_width = 448.0
    cx = 443.50003051757812
    cy = 521.0
    output = "HDMI-A-1"
    placement_height = 1234.0
    placement_width = 823.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = true
        center_text = true
        clock_style = "digital"
        color = "on_surface_variant"
        shadow = false

[dock]
active_monitor_only = true
reserve_space = false
smart_auto_hide = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-clock@DP-1",
    "lockscreen-date@DP-1",
    "lockscreen-login-box@DP-1",
    "lockscreen-clock@HDMI-A-1",
    "lockscreen-date@HDMI-A-1",
    "lockscreen-login-box@HDMI-A-1"
